name: Build iHPro Activator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            python-version: '3.10'
            executable: iHPro_Activator.exe
            sep: ';'
          - os: macos-latest
            python-version: '3.10'
            executable: iHPro_Activator
            sep: ':'
          - os: ubuntu-latest
            python-version: '3.10'
            executable: iHPro_Activator
            sep: ':'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymobiledevice3 PyQt5 certifi urllib3

      - name: Build
        run: |
          pyinstaller --onefile --windowed \
            --name ${{ matrix.executable }} \
            --add-data "payload.sql${{ matrix.sep }}." \
            --add-data "logo.png${{ matrix.sep }}." \
            --add-data "fond.png${{ matrix.sep }}." \
            --collect-all pymobiledevice3 \
            --hidden-import pymobiledevice3.services.afc \
            --hidden-import pymobiledevice3.services.diagnostics \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.executable }}-${{ matrix.os }}
          path: dist/${{ matrix.executable }}
