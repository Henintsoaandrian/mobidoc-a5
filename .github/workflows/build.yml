name: Dhmf Software Bypass A5-A6 Tool V1.0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build ${{ matrix.file_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file_name: "Dhmf_Software_Bypass_Windows"
          - os: ubuntu-latest
            file_name: "Dhmf_Software_Bypass_Linux"
          - os: macos-latest
            file_name: "Dhmf_Software_Bypass_macOS_ARM"
          - os: macos-15
            file_name: "Dhmf_Software_Bypass_macOS_Intel"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Install DMG Creator (macOS only)
      if: runner.os == 'macOS'
      run: brew install create-dmg

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "${{ matrix.file_name }}" `
          --icon "logo.ico" `
          --add-data "payload.sql;." `
          --add-data "logo.png;." `
          --add-data "fond.png;." `
          --hidden-import "pymobiledevice3" `
          --hidden-import "certifi" `
          --hidden-import "requests" `
          main.py

    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name "${{ matrix.file_name }}" \
          --add-data "payload.sql:." \
          --add-data "logo.png:." \
          --add-data "fond.png:." \
          --hidden-import "pymobiledevice3" \
          --hidden-import "certifi" \
          --hidden-import "requests" \
          main.py

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name "${{ matrix.file_name }}" \
          --icon "logo.icns" \
          --add-data "payload.sql:." \
          --add-data "logo.png:." \
          --add-data "fond.png:." \
          --hidden-import "pymobiledevice3" \
          --hidden-import "certifi" \
          --hidden-import "requests" \
          main.py

    - name: Package macOS DMG
      if: runner.os == 'macOS'
      run: |
        cd dist
        plutil -replace LSMinimumSystemVersion -string "10.13" \
          "${{ matrix.file_name }}.app/Contents/Info.plist"
        codesign --force --deep --sign - "${{ matrix.file_name }}.app"
        create-dmg \
          --volname "Dhmf Software Bypass A5-A6 Tool V1.0" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --text-size 12 \
          --hide-extension "${{ matrix.file_name }}.app" \
          --app-drop-link 450 140 \
          --icon "${{ matrix.file_name }}.app" 150 140 \
          "${{ matrix.file_name }}.dmg" \
          "${{ matrix.file_name }}.app"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.file_name }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/${{ matrix.file_name }}
