name: Build iHPro Activator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            sep: ";"
            suffix: Windows
            icon_flag: "--icon logo.ico"
          - os: macos-latest
            arch: arm64
            sep: ":"
            suffix: macOS_ARM
            icon_flag: "--icon logo.icns"
          - os: macos-13
            arch: x64
            sep: ":"
            suffix: macOS_Intel
            icon_flag: "--icon logo.icns"
          - os: ubuntu-latest
            arch: x64
            sep: ":"
            suffix: Linux
            icon_flag: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies (all)
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pymobiledevice3 pyinstaller requests certifi

    - name: Install Windows-specific dependencies
      if: runner.os == 'Windows'
      run: pip install pywin32

    - name: Install Linux libusb (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "iHPro_Activator_${{ matrix.suffix }}" `
          ${{ matrix.icon_flag }} `
          --add-data "payload.sql${{ matrix.sep }}." `
          --add-data "logo.png${{ matrix.sep }}." `
          --add-data "fond.png${{ matrix.sep }}." `
          --collect-all pymobiledevice3 `
          --hidden-import "pymobiledevice3" `
          --hidden-import "requests" `
          --hidden-import "certifi" `
          --hidden-import "win32security" `
          --hidden-import "win32file" `
          --hidden-import "win32api" `
          main.py

    - name: Build with PyInstaller (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name "iHPro_Activator_${{ matrix.suffix }}" \
          ${{ matrix.icon_flag }} \
          --add-data "payload.sql${{ matrix.sep }}." \
          --add-data "logo.png${{ matrix.sep }}." \
          --add-data "fond.png${{ matrix.sep }}." \
          --collect-all pymobiledevice3 \
          --hidden-import "pymobiledevice3" \
          --hidden-import "requests" \
          --hidden-import "certifi" \
          main.py

    - name: Create DMG (macOS only)
      if: runner.os == 'macOS'
      run: |
        brew install create-dmg
        cd dist
        # Signature ad-hoc (facultative)
        codesign --force --deep --sign - "iHPro_Activator_${{ matrix.suffix }}.app"
        create-dmg \
          --volname "iHPro Activator" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --text-size 12 \
          --hide-extension "iHPro_Activator_${{ matrix.suffix }}.app" \
          --app-drop-link 450 140 \
          --icon "iHPro_Activator_${{ matrix.suffix }}.app" 150 140 \
          "iHPro_Activator_${{ matrix.suffix }}.dmg" \
          "iHPro_Activator_${{ matrix.suffix }}.app"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iHPro_Activator_${{ matrix.suffix }}
        path: |
          dist/iHPro_Activator_${{ matrix.suffix }}.exe
          dist/iHPro_Activator_${{ matrix.suffix }}.app
          dist/iHPro_Activator_${{ matrix.suffix }}.dmg
          dist/iHPro_Activator_${{ matrix.suffix }}
        if-no-files-found: warn
