name: Dhmf Software Bypass A5-A6 Tool V1.0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build ${{ matrix.file_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file_name: "Dhmf_Software_Bypass_Windows"
          - os: ubuntu-latest
            file_name: "Dhmf_Software_Bypass_Linux"
          - os: macos-latest
            file_name: "Dhmf_Software_Bypass_macOS_ARM"
          - os: macos-15
            file_name: "Dhmf_Software_Bypass_macOS_Intel"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Common Dependencies
      run: |
        pip install PyQt5 pymobiledevice3==7.8.3 pyinstaller requests certifi

    - name: Install Windows-specific Dependencies
      if: runner.os == 'Windows'
      run: pip install pywin32

    - name: Install DMG Creator
      if: runner.os == 'macOS'
      run: brew install create-dmg

    - name: List files for debugging
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Listing all files ==="
        ls -la
        echo "=== Check if logo.png exists ==="
        if [ -f "logo.png" ]; then echo "logo.png found"; else echo "logo.png NOT found"; fi
        echo "=== Check if fond.png exists ==="
        if [ -f "fond.png" ]; then echo "fond.png found"; else echo "fond.png NOT found"; fi
        echo "=== Check if payload.sql exists ==="
        if [ -f "payload.sql" ]; then echo "payload.sql found"; else echo "payload.sql NOT found"; fi
      shell: bash

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
      run: |
        pyinstaller --noconfirm --onedir \
          --name "${{ matrix.file_name }}" \
          --icon "$(pwd)/logo.icns" \
          --add-data "$(pwd)/payload.sql:." \
          --add-data "$(pwd)/logo.png:." \
          --add-data "$(pwd)/fond.png:." \
          --collect-all pymobiledevice3 \
          --hidden-import "pymobiledevice3" \
          --hidden-import "requests" \
          --hidden-import "certifi" \
          main.py

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "${{ matrix.file_name }}" `
          --icon "$(pwd)\logo.ico" `
          --add-data "$(pwd)\payload.sql;." `
          --add-data "$(pwd)\logo.png;." `
          --add-data "$(pwd)\fond.png;." `
          --collect-all pymobiledevice3 `
          --hidden-import "pymobiledevice3" `
          --hidden-import "requests" `
          --hidden-import "certifi" `
          --hidden-import "win32security" `
          --hidden-import "win32file" `
          --hidden-import "win32api" `
          main.py

    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name "${{ matrix.file_name }}" \
          --add-data "$(pwd)/payload.sql:." \
          --add-data "$(pwd)/logo.png:." \
          --add-data "$(pwd)/fond.png:." \
          --collect-all pymobiledevice3 \
          --hidden-import "pymobiledevice3" \
          --hidden-import "requests" \
          --hidden-import "certifi" \
          main.py

    - name: Package macOS DMG
      if: runner.os == 'macOS'
      run: |
        cd dist
        plutil -replace LSMinimumSystemVersion -string "10.13" \
          "${{ matrix.file_name }}.app/Contents/Info.plist"
        codesign --force --deep --sign - "${{ matrix.file_name }}.app"
        create-dmg \
          --volname "Dhmf Software Bypass A5-A6 Tool V1.0" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --text-size 12 \
          --hide-extension "${{ matrix.file_name }}.app" \
          --app-drop-link 450 140 \
          --icon "${{ matrix.file_name }}.app" 150 140 \
          "${{ matrix.file_name }}.dmg" \
          "${{ matrix.file_name }}.app"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file_name }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/${{ matrix.file_name }}
