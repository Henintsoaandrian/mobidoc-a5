name: Dhmf Software Bypass A5-A6 Tool V1.0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build ${{ matrix.file_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file_name: "Dhmf_Software_Bypass_Windows"
          - os: ubuntu-latest
            file_name: "Dhmf_Software_Bypass_Linux"
          - os: macos-latest
            file_name: "Dhmf_Software_Bypass_macOS_ARM"
          - os: macos-15
            file_name: "Dhmf_Software_Bypass_macOS_Intel"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Common Dependencies
      run: |
        pip install PyQt5 pymobiledevice3==7.8.3 pyinstaller requests certifi

    - name: Install Windows-specific Dependencies
      if: runner.os == 'Windows'
      run: pip install pywin32

    - name: Install DMG Creator
      if: runner.os == 'macOS'
      run: brew install create-dmg

    - name: Create spec file and build (Linux)
      if: runner.os == 'Linux'
      run: |
        cat > build.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        datas = [
            ('payload.sql', '.'),
            ('logo.png', '.'),
            ('fond.png', '.'),
        ]
        
        hiddenimports = ['pymobiledevice3', 'requests', 'certifi']
        
        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=datas,
            hiddenimports=hiddenimports,
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            noarchive=False,
        )
        
        pyz = PYZ(a.pure)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.datas,
            [],
            name='Dhmf_Software_Bypass_Linux',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        EOF
        pyinstaller build.spec

    - name: Create spec file and build (macOS)
      if: runner.os == 'macOS'
      run: |
        cat > build.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        datas = [
            ('payload.sql', '.'),
            ('logo.png', '.'),
            ('fond.png', '.'),
        ]
        
        hiddenimports = ['pymobiledevice3', 'requests', 'certifi']
        
        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=datas,
            hiddenimports=hiddenimports,
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            noarchive=False,
        )
        
        pyz = PYZ(a.pure)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.datas,
            [],
            name='${{ matrix.file_name }}',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
            icon='logo.icns',
        )
        
        app = BUNDLE(
            exe,
            name='${{ matrix.file_name }}.app',
            icon='logo.icns',
            bundle_identifier=None,
            info_plist={
                'LSMinimumSystemVersion': '10.13',
            },
        )
        EOF
        pyinstaller build.spec

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "${{ matrix.file_name }}" `
          --icon "logo.ico" `
          --add-data "payload.sql;." `
          --add-data "logo.png;." `
          --add-data "fond.png;." `
          --collect-all pymobiledevice3 `
          --hidden-import "pymobiledevice3" `
          --hidden-import "requests" `
          --hidden-import "certifi" `
          --hidden-import "win32security" `
          --hidden-import "win32file" `
          --hidden-import "win32api" `
          main.py

    - name: Package macOS DMG
      if: runner.os == 'macOS'
      run: |
        cd dist
        codesign --force --deep --sign - "${{ matrix.file_name }}.app"
        create-dmg \
          --volname "Dhmf Software Bypass A5-A6 Tool V1.0" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --text-size 12 \
          --hide-extension "${{ matrix.file_name }}.app" \
          --app-drop-link 450 140 \
          --icon "${{ matrix.file_name }}.app" 150 140 \
          "${{ matrix.file_name }}.dmg" \
          "${{ matrix.file_name }}.app"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.file_name }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/${{ matrix.file_name }}